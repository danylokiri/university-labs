<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>3 Column Layout</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="header">
      <img
        class="facebook_logo"
        src="assets/img/facebook_logo.svg"
        alt="logo"
      />
    </header>
    <div class="container">
      <main class="center column">
        <article>
          <h1>Contact</h1>
        </article>

        <form>
          <label>name</label>
          <input type="text" />
        </form>
        <form>
          <label>birthday</label>
          <input type="date" />
        </form>
        <form>
          <label>email</label>
          <input type="email" />
        </form>
        <form>
          <label>girl</label>
          <input type="radio" />
          <label>boy</label>
          <input type="radio" />
        </form>
        <form>
          <label>phone number</label>
          <input type="number" />
        </form>
        <form>
          <label>password</label>
          <input type="password" />
        </form>
        <form>
          <label>i accept terms and conditions</label>
          <input type="checkbox" />
        </form>
        <form>
          <label>notes</label>
          <textarea cols="30" rows="10"></textarea>
        </form>
        <form>
          <label>photo</label>
          <input type="file" />
        </form>
        <form>
          <label>submit button</label>
          <input type="submit" />
        </form>
      </main>
      <nav class="left column">
        <h3>Left heading</h3>
        <ul>
          <li><a href="index.html">Main</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="media.html">Media</a></li>
          <li><a href="slider.html">Slider</a></li>
          <li><a href="table.html">Table</a></li>
          <li><a href="about.html">about</a></li>
          <li><a href="canvas.html">about</a></li>
        </ul>
      </nav>
      <div class="right column">
        <h3>Right heading</h3>
        <p></p>
      </div>
      <div class="push"></div>
    </div>
    <div class="footer-wrapper">
      <footer class="footer">
        <img
          class="facebook_logo"
          src="assets/img/facebook_logo.svg"
          alt="logo"
        />
      </footer>
    </div>
  </body>
</html>
