<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список ігор</title>
</head>
<body>
<h1>Список ігор</h1>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Назва</th>
        <th>Рік виходу</th>
        <th>Рейтинг</th>
        <th>Розробник</th>
        <th>Країна</th>
        <th>Жанр</th>
        <th>Віковий рейтинг</th>
        <th>Ціна</th>
        <th>Опис</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="g : ${games}">
        <!--game -->
        <td th:text="${g.title}"></td>
        <td th:text="${g.releaseYear}"></td>
        <td th:text="${g.rating}"></td>

        <td th:text="${g.developer != null ? g.developer.name : '—'}"></td>
        <td th:text="${g.developer != null ? g.developer.country : '—'}"></td>

        <td th:text="${g.genre != null ? g.genre.name : '—'}"></td>

        <td th:text="${g.details != null ? g.details.ageRating : '—'}"></td>
        <td th:text="${g.details != null ? g.details.price : '—'}"></td>
        <td th:text="${g.details != null ? g.details.description : '—'}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
