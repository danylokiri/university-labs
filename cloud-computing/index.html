<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Information</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f4f4f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 32px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
            max-width: 420px;
            width: 100%;
        }
        .card h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 24px;
            color: #111827;
        }
        .field {
            margin-bottom: 10px;
            font-size: 16px;
            color: #111827;
        }
        .field span.label {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Information</h1>

        <div class="field">
            <span class="label">First Name:</span> First
        </div>
        <div class="field">
            <span class="label">Last Name:</span> Last
        </div>
        <div class="field">
            <span class="label">Student Group:</span> GROUP
        </div>
    </div>
</body>
</html>
